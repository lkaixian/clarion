# CLARION -- demo-capable on-prem topology (roadmap task P1.11).
#
# This is the "single-VM fallback for the pilot" Compose file described in
# healthcare/On-Prem Architecture.md. It is NOT the final hardened production
# stack -- see docs/deployment.md for what is wired now vs. TODO.
#
#   Bring up:        docker compose --env-file .env.docker up -d --build
#   Validate config: docker compose --env-file .env.docker config
#
# Only the `proxy` (Caddy) publishes host ports (80/443) -- roadmap task
# P1.9. It terminates TLS, adds HSTS/CSP/security headers, and routes
# /api/* -> backend, everything else -> web. Two network segments (P1.9):
# `edge` (proxy <-> web/backend) and `internal` (backend <-> data/PACS) --
# so a popped web/edge can't reach the data tier and the data tier can't
# reach the API. Every service has a healthcheck and a named volume.
#
# For local debugging without going through TLS, start a service with its
# port published ad hoc:  docker compose run --service-ports backend

name: clarion

# ---------------------------------------------------------------------------
# Reusable snippets
# ---------------------------------------------------------------------------
x-restart: &restart
  restart: unless-stopped

x-env-file: &env-file
  env_file:
    - path: ./.env.docker
      required: false

# ===========================================================================
# Services
# ===========================================================================
services:

  # -------------------------------------------------------------------------
  # Edge -- the only service that publishes to the host (P1.9)
  # -------------------------------------------------------------------------
  proxy:
    <<: [*restart, *env-file]
    image: caddy:2.8-alpine
    environment:
      # FQDN clients use. "localhost" for the demo; set to
      # e.g. clarion.example.edu.my in .env.docker for a real deployment.
      CLARION_SITE_ADDRESS: ${CLARION_SITE_ADDRESS:-localhost}
      # Demo: "tls internal" (Caddy local CA). Production: override with
      #   tls /etc/caddy/certs/clarion.crt /etc/caddy/certs/clarion.key
      CLARION_TLS_DIRECTIVE: ${CLARION_TLS_DIRECTIVE:-tls internal}
      # Extra CSP connect-src entries (space-separated), e.g. the
      # on-workstation NFC bridge: http://localhost:8770 http://127.0.0.1:8770
      CLARION_CSP_CONNECT_EXTRA: ${CLARION_CSP_CONNECT_EXTRA:-}
      # HSTS value. Short by default; ramp for prod. No "preload" without
      # The University domain-owner sign-off (see .env.docker.example).
      CLARION_HSTS: ${CLARION_HSTS:-max-age=300}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # Fixed address so the backend can trust X-Forwarded-* from exactly
        # this hop (FORWARDED_ALLOW_IPS below) and nothing else.
        ipv4_address: 172.28.0.2
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      # Plain-HTTP loopback route in the Caddyfile -- no TLS / cert / DNS
      # dependency, so it works identically for the demo and the FQDN config.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # -------------------------------------------------------------------------
  # Application tier
  # -------------------------------------------------------------------------
  backend:
    <<: [*restart, *env-file]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clarion/backend:local
    environment:
      APP_ENV: ${APP_ENV:-demo}
      # database.py supports MariaDB. Default points at the mounted SQLite volume
      # so the app works out-of-the-box in demo mode.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/clarion.db}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # P5.1: JSON logs (app/log_context.py) -- stdout -> Promtail -> Loki.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # gunicorn trusts X-Forwarded-* only from the edge proxy's fixed
      # address (see the proxy service). The rate limiter keys on the
      # resulting client IP, so this must never widen to "*".
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.2}
      # Wiring hints for the ObjectStore / cache work (P1.6). Harmless today.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      # Scoped clarion-backend user (minio-init), not the MinIO root key.
      MINIO_ACCESS_KEY: clarion-backend
      MINIO_SECRET_KEY: ${MINIO_BACKEND_PASSWORD:-change-me-minio-backend}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      # On-prem AI (P4.3): Ollama runs on the host (it needs the GPU), not
      # as a compose service, so "localhost" from inside this container
      # would be the container itself. host.docker.internal + the
      # extra_hosts entry below resolve to the host on Linux, Mac and
      # Windows Docker Desktop alike.
      CLARION_LOCAL_LLM_URL: ${CLARION_LOCAL_LLM_URL:-http://host.docker.internal:11434}
      # PACS (P4.7) -- must match the orthanc service's ORTHANC__REGISTERED_USERS.
      CLARION_ORTHANC_USER: ${ORTHANC_HTTP_USER:-clarion}
      CLARION_ORTHANC_PASSWORD: ${ORTHANC_HTTP_PASSWORD:-change-me-orthanc-http}
      # Lab-analyser order push (P4.8) -- the REAL analyser device's own
      # MLLP port, not this stack's own hl7-listener service (that's the
      # opposite direction: results coming IN, not orders going out).
      # Unset by default -- no real analyser exists in this environment, so
      # the push is disabled (best-effort, never blocks order creation
      # either way) until a deployment points this at real hardware.
      CLARION_HL7_ANALYSER_HOST: ${CLARION_HL7_ANALYSER_HOST:-}
      CLARION_HL7_ANALYSER_PORT: ${CLARION_HL7_ANALYSER_PORT:-2575}
      # SECRET_KEY, OTP_HMAC_KEY, MAILGUN_*, CLARION_LOCAL_LLM_MODEL,
      # CLARION_LOCAL_VISION_MODEL, CLARION_DISABLE_LOCAL_AI come from
      # ./.env.docker via env_file -- never inline real secrets here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - clarion_db:/app/data
      - clarion_uploads:/app/uploads
    expose:
      - "8000"
    networks:
      # edge: reachable by the proxy (and web's fallback /api proxy).
      # internal: reaches mariadb / minio / redis. NOT the other way round.
      # observability (P5.1): scraped by prometheus (GET /metrics) -- read
      # access only, this network carries no inbound write path to anything.
      - edge
      - internal
      - observability
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # P5.1: liveness only (see app/main.py's /healthz docstring) -- /readyz
      # (DB + object store) exists too but isn't what a container restart
      # policy should key on.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # Lab-analyser HL7 v2 / MLLP listener (P4.8) -- own process, not
  # one of the gunicorn web workers (see app/hl7_listener.py's module
  # docstring for why: a long-lived listener socket bound once per worker
  # either conflicts or leaves workers silently without one). Internal-
  # network-only, same as mariadb/minio/orthanc -- a real analyser reaches
  # it over the site network, never through the public edge.
  hl7-listener:
    <<: [*restart, *env-file]
    image: clarion/backend:local
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/clarion.db}
    command: ["python", "-m", "app.hl7_listener", "--port", "2575"]
    volumes:
      - clarion_db:/app/data
    expose:
      - "2575"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 2575), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # One-shot schema migration for the MariaDB path (code-review follow-up 2026-09-07).
  # NOT started by default -- the SQLite demo migrates itself via the app's
  # _ensure_schema() at boot. For a MariaDB deployment, with the DB already up:
  #
  #   bash backend/db/mariadb/generate-encryption-key.sh     # P2.7, once
  #   docker compose --profile mariadb up -d mariadb
  #   docker compose --profile migrate run --rm migrate      # BEFORE `backend`
  #
  # `backend`'s runtime account has no DDL rights and refuses to serve against
  # an un-migrated DB.
  #
  # It runs as the DDL-privileged `clarion_migrate` account. The P1.6
  # legacy-column drop (b7f1c0d94a2e) now aborts if blobs have not first been
  # moved with db/migrate_uploads_to_objectstore.py -- see docs/deployment.md
  # "MariaDB cutover" for the full ordered runbook.
  migrate:
    <<: [*restart, *env-file]
    profiles: ["migrate"]
    restart: "no"
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clarion/backend:local
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-mysql+pymysql://clarion_migrate:${MARIADB_MIGRATE_PASSWORD:-change-me-migrate}@mariadb:3306/clarion?charset=utf8mb4}
    # backend/Dockerfile's runtime image sets WORKDIR /app/data (so the
    # `backend` service's relative SQLite path resolves there); alembic.ini
    # lives at /app and alembic only looks for it in the CWD, with no -c flag
    # on the command below. Without this override `alembic upgrade head`
    # silently loads an empty Config ("No 'script_location' key found") and
    # does nothing -- found live during P5.2 load-test setup (docs/deployment.md
    # documented this exact `docker compose run --rm migrate` invocation, but
    # it had never actually been re-run since WORKDIR moved to /app/data).
    working_dir: /app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - internal
    depends_on:
      mariadb:
        condition: service_healthy

  web:
    <<: *restart
    build:
      context: ./web
      dockerfile: Dockerfile
    image: clarion/web:local
    environment:
      # /api => same-origin proxy (the edge proxy routes it to the backend;
      # web/nginx.conf also proxies it if web is hit directly). A full URL
      # here switches the SPA to direct cross-origin calls.
      API_BASE: ${API_BASE:-/api}
    expose:
      - "8080"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # -------------------------------------------------------------------------
  # Data tier
  # -------------------------------------------------------------------------

  # MariaDB -- the app can run on this now (P1.3): set DATABASE_URL to
  # mysql+pymysql://clarion_app:...@mariadb:3306/clarion?charset=utf8mb4 and run
  # `alembic upgrade head` as clarion_migrate first. The demo still defaults to
  # SQLite. Copying the existing demo data across is P1.4.
  mariadb:
    # Behind a profile: the SQLite demo doesn't use it, and P2.7 TDE means
    # it won't start until `bash backend/db/mariadb/generate-encryption-key.sh`
    # has run. Bring it up with:  docker compose --profile mariadb up -d
    profiles: ["mariadb"]
    <<: [*restart, *env-file]
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-clarion}
      MARIADB_APP_PASSWORD: ${MARIADB_APP_PASSWORD:-change-me-app}
      MARIADB_MIGRATE_PASSWORD: ${MARIADB_MIGRATE_PASSWORD:-change-me-migrate}
      MARIADB_REPORT_PASSWORD: ${MARIADB_REPORT_PASSWORD:-change-me-report}
      # P5.1 added the clarion_metrics account (mysqld-exporter) to
      # 10-accounts.sh's required-var check, but never added it here -- the
      # script aborts on a missing required var BEFORE creating any account,
      # so clarion_app/clarion_migrate/clarion_report silently never existed
      # either. Found live during P5.2 load-test setup (docker logs showed
      # "MARIADB_METRICS_PASSWORD must be set", then every account's login
      # failed with 1045 Access Denied).
      MARIADB_METRICS_PASSWORD: ${MARIADB_METRICS_PASSWORD:-change-me-metrics-password}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
      # Binary log in ROW format -- point-in-time recovery (P2.8 ships the
      # 15-min binlog to the backup repo). encrypt_binlog=ON lives in
      # encryption.cnf (P2.7).
      - --log-bin=clarion-bin
      - --binlog-format=ROW
      # 7 days on disk -- P2.8 ships them off every 15 min, so local is just
      # the replay buffer. (`--expire-logs-days` is deprecated in 11.4.)
      - --binlog-expire-logs-seconds=604800
      # MariaDB refuses CREATE TRIGGER/FUNCTION from a non-SUPER account
      # while binary logging is on, to stop a non-deterministic routine from
      # corrupting a STATEMENT-replicated replica. Irrelevant here --
      # binlog-format is ROW above, which replicates actual row changes, not
      # statements, so that failure mode doesn't exist -- but the check
      # fires regardless of format. Without this, P2.9's audit_logs
      # append-only trigger (clarion_migrate, deliberately not SUPER --
      # least privilege) fails outright: found live running `alembic
      # upgrade head` against MariaDB for the first time (P5.2 load-test
      # setup; error 1419).
      - --log-bin-trust-function-creators=1
      # The three least-privilege accounts (clarion_app / clarion_migrate /
      # clarion_report) are created on first init by
      # ./backend/db/mariadb/10-accounts.sh (mounted below).
      # TODO: REQUIRE SSL on the accounts once MariaDB TLS is configured
      # (P1.9 leftover / P2.7 in-transit half).
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/db/mariadb:/docker-entrypoint-initdb.d:ro
      # P2.7 data-at-rest encryption: the config fragment, and the key
      # material generated by generate-encryption-key.sh (git-ignored --
      # `docker compose up` fails loudly if the encryption/ dir is empty,
      # which is the intended "provision the key first" gate).
      - ./backend/db/mariadb/encryption.cnf:/etc/mysql/mariadb.conf.d/99-encryption.cnf:ro
      - ./backend/db/mariadb/encryption:/etc/mysql/encryption:ro
    expose:
      - "3306"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # MinIO -- S3-compatible object store for documents / signatures / medicine
  # photos / derived thumbnails / DICOM. ObjectStore abstraction is P1.6.
  #
  # Pulled from quay.io, not Docker Hub -- MinIO stopped publishing free
  # Docker images in Oct 2025, went to "maintenance mode" then archived its
  # repo Feb 2026, and pulled the `minio` org off Docker Hub entirely on
  # 2026-09-11 (minio/minio and minio/mc both 404 there now). quay.io/minio/
  # minio is still where the last free community builds live.
  # RELEASE.2025-09-07T16-13-09Z is the newest one available there (`latest`
  # points at it too) -- everything after that on quay.io is a
  # `.hotfix.<hash>`-suffixed enterprise/paid-subscriber build, not the free
  # stream. Accepted residual risk: this tag predates CVE-2025-62506
  # (privilege-escalation via session-policy bypass in service accounts/STS,
  # fixed in the Oct-15 GitHub release that quay.io never got as a free
  # tag) -- exploiting it needs credentials for an already-restricted
  # service account, and MinIO here is `internal`-network-only, never
  # host-exposed. Revisit if MinIO ever ships a free fix, or when
  # `_minio-dead-storage-decision-pending_` memory's alternatives
  # (RustFS etc.) mature past alpha.
  minio:
    <<: [*restart, *env-file]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clarion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clarion-dev-secret}
      # MINIO_BROWSER: "off"   # enable to disable the web console in prod
    volumes:
      - minio_data:/data
    expose:
      - "9000"   # S3 API
      - "9001"   # web console
    # To reach the console from the host during a demo, uncomment:
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # One-shot: provisions clarion-backend / clarion-orthanc / clarion-backup
  # (backend/db/minio/10-accounts.sh + policies/) so `backend`, `orthanc` and
  # `backup` each hold a scoped MinIO user instead of the root key -- MinIO
  # has no first-boot-only init hook like mariadb's /docker-entrypoint-
  # initdb.d/, so this runs every `docker compose up` and stays idempotent
  # instead. Also from quay.io -- see the `minio` service's comment.
  minio-init:
    <<: [*restart, *env-file]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "/init/10-accounts.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clarion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clarion-dev-secret}
      MINIO_BACKEND_PASSWORD: ${MINIO_BACKEND_PASSWORD:-change-me-minio-backend}
      MINIO_ORTHANC_PASSWORD: ${MINIO_ORTHANC_PASSWORD:-change-me-minio-orthanc}
      MINIO_BACKUP_PASSWORD: ${MINIO_BACKUP_PASSWORD:-change-me-minio-backup}
    volumes:
      - ./backend/db/minio/10-accounts.sh:/init/10-accounts.sh:ro
      - ./backend/db/minio/policies:/policies:ro
    networks:
      - internal
    depends_on:
      minio:
        condition: service_healthy

  # Redis -- cache + (later) rate-limit / session / worker broker.
  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # PACS tier (roadmap task P4.7) -- minimal, demo-only config for now.
  # -------------------------------------------------------------------------

  # PostgreSQL index for Orthanc.
  orthanc-postgres:
    <<: [*restart, *env-file]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ORTHANC_PG_USER:-orthanc}
      POSTGRES_PASSWORD: ${ORTHANC_PG_PASSWORD:-change-me-orthanc}
      POSTGRES_DB: ${ORTHANC_PG_DB:-orthanc}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - orthanc_pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORTHANC_PG_USER:-orthanc} -d ${ORTHANC_PG_DB:-orthanc}"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  orthanc:
    <<: [*restart, *env-file]
    image: orthancteam/orthanc:24.10.1
    environment:
      ORTHANC__NAME: "CLARION PACS"
      # Basic auth -- backend/app/pacs.py sends these same creds
      # (CLARION_ORTHANC_USER/PASSWORD). Orthanc is still internal-network-
      # only (never host-exposed, see the comment on this file's `internal`
      # network below); this is defense-in-depth if that boundary is ever
      # breached, not the only guard.
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_HTTP_USER:-clarion}":"${ORTHANC_HTTP_PASSWORD:-change-me-orthanc-http}"}'
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      # DICOMweb plugin (WADO-RS / QIDO-RS / STOW-RS) for the OHIF viewer.
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      # PostgreSQL index (orthanc-postgres, below) instead of Orthanc's
      # built-in SQLite index -- real concurrency, same reason the app
      # itself moved off SQLite (P1.3).
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "false"  # storage is S3 (below), not PG
      ORTHANC__POSTGRESQL__HOST: "orthanc-postgres"
      ORTHANC__POSTGRESQL__DATABASE: "${ORTHANC_PG_DB:-orthanc}"
      ORTHANC__POSTGRESQL__USERNAME: "${ORTHANC_PG_USER:-orthanc}"
      ORTHANC__POSTGRESQL__PASSWORD: "${ORTHANC_PG_PASSWORD:-change-me-orthanc}"
      # S3 storage on the existing minio service -- `clarion-dicom` bucket
      # (app/storage.py's BUCKET_DICOM) is provisioned by the backend's own
      # ObjectStore bootstrap at app startup, same bucket the S3 plugin
      # writes DICOM instances into. VirtualAddressing must be false for
      # MinIO (path-style, not bucket-subdomain). Region is unused by MinIO
      # but the AWS SDK requires a syntactically valid value.
      # Scoped clarion-orthanc user (minio-init) -- s3:* on clarion-dicom
      # only, not the MinIO root key.
      ORTHANC__AWS_S3_STORAGE__BUCKET_NAME: "clarion-dicom"
      ORTHANC__AWS_S3_STORAGE__ENDPOINT: "http://minio:9000"
      ORTHANC__AWS_S3_STORAGE__REGION: "us-east-1"
      ORTHANC__AWS_S3_STORAGE__ACCESS_KEY: "clarion-orthanc"
      ORTHANC__AWS_S3_STORAGE__SECRET_KEY: "${MINIO_ORTHANC_PASSWORD:-change-me-minio-orthanc}"
      ORTHANC__AWS_S3_STORAGE__VIRTUAL_ADDRESSING: "false"
      AWS_EC2_METADATA_DISABLED: "true"  # skip the pointless IMDS probe -- creds are explicit above
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    expose:
      - "8042"   # HTTP / DICOMweb
      - "4242"   # DICOM protocol (DIMSE)
    networks:
      - internal
    depends_on:
      orthanc-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u ${ORTHANC_HTTP_USER:-clarion}:${ORTHANC_HTTP_PASSWORD:-change-me-orthanc-http} http://127.0.0.1:8042/system || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Backup runner (roadmap P2.8, the tender). Not started by default --
  #   docker compose --profile backup up -d backup     (installs the cron)
  #   docker compose --profile backup run --rm backup "./backup.sh weekly"
  #   docker compose --profile backup run --rm backup "./pre-update-snapshot.sh 'reason'"
  # mariadb-backup / mydumper / mc / restic / age are baked into the image.
  # See backend/backup/README.md for the schedule + DR runbook.
  backup:
    build: ./backend/backup
    profiles: ["backup"]
    environment:
      BACKUP_ROOT: /backup
      MARIADB_HOST: mariadb
      MARIADB_DATABASE: ${MARIADB_DATABASE:-clarion}
      MARIADB_BACKUP_USER: clarion_migrate
      MARIADB_BACKUP_PASSWORD: ${MARIADB_MIGRATE_PASSWORD:-change-me-migrate}
      MINIO_ENDPOINT: http://minio:9000
      # Scoped clarion-backup user (minio-init) -- read-only, not the root key.
      MINIO_ACCESS_KEY: clarion-backup
      MINIO_SECRET_KEY: ${MINIO_BACKUP_PASSWORD:-change-me-minio-backup}
      # required for the backup service -- lib.sh fails loudly at run time if
      # unset (kept as :- here so a plain `docker compose config` of the
      # non-backup stack doesn't error on them).
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      RETENTION_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-30}
    volumes:
      - clarion_backup:/backup
      - mariadb_data:/backup/binlog-src:ro   # binlogs live in the datadir
    networks:
      - internal
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # Install the cron from README.md and run it in the foreground.
    command:
      - |
        cat > /etc/cron.d/clarion-backup <<'CRON'
        */15 * * * * root cd /opt/clarion-backup && ./backup.sh binlog >> /backup/cron.log 2>&1
        15 1 * * 1-6 root cd /opt/clarion-backup && ./backup.sh daily  >> /backup/cron.log 2>&1
        15 1 * * 0   root cd /opt/clarion-backup && ./backup.sh weekly >> /backup/cron.log 2>&1
        CRON
        chmod 0644 /etc/cron.d/clarion-backup
        printenv | grep -E '^(BACKUP_|MARIADB_|MINIO_|RESTIC_|AGE_|RETENTION_)' > /etc/environment
        touch /backup/cron.log
        cron && tail -F /backup/cron.log

  # -------------------------------------------------------------------------
  # Observability tier (roadmap P5.1, the tender) -- behind its own
  # profile, same reasoning as `mariadb`/`backup`/`migrate` above: this is
  # ops infrastructure, not something the base demo boot needs, and keeping
  # it opt-in means it can never be the reason the core stack fails to come
  # up (e.g. Alertmanager refusing to start without a real SMTP secret --
  # see observability/alertmanager.yml). Bring it up with:
  #   docker compose --profile observability up -d
  #   docker compose --profile mariadb --profile observability up -d   # + mysqld-exporter
  # `backend` itself is NOT behind this profile -- it always joins the
  # `observability` network (see its own `networks:` above) so Prometheus
  # can scrape it whenever this profile IS active, without backend needing
  # to know or care whether it is.
  # -------------------------------------------------------------------------

  prometheus:
    <<: *restart
    profiles: ["observability"]
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    expose:
      - "9090"
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  alertmanager:
    <<: *restart
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # smtp_auth_password_file (see alertmanager.yml) -- empty by default
      # (only .gitkeep is committed, see .gitignore); provision a real
      # observability/secrets/smtp_password before relying on this for a
      # real deployment.
      - ./observability/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    expose:
      - "9093"
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  grafana:
    # No env_file (unlike most services above) -- it needs only the two
    # GRAFANA_ADMIN_* vars, already resolved via ${...} interpolation below,
    # and this way it never sees MARIADB_ROOT_PASSWORD/MINIO_ROOT_PASSWORD/
    # SECRET_KEY/MAILGUN_* the way env_file's blanket dump would hand it.
    <<: *restart
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # No "change-me" fallback here on purpose -- Grafana refuses an empty
      # admin password outright at startup, so an unset value fails loudly
      # rather than shipping a guessable default (unlike most other
      # `change-me-*` fallbacks in this file).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env.docker}
      # Anonymous access stays off (Grafana's own default) -- this dashboard
      # can show PHI-adjacent operational data (e.g. per-facility request
      # volume), so it gets a real login like everything else in this stack.
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    # Published directly (unlike MinIO's admin console, which stays
    # commented out) -- Grafana's whole point is visibility for the team,
    # and it still sits behind its own real login.
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  loki:
    <<: *restart
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Tails every container's stdout/stderr (structured JSON from `backend`
  # thanks to LOG_FORMAT=json above; plain text from everything else) and
  # ships it to Loki. Needs the Docker socket read-only to discover
  # containers and find their json-file log paths -- this is the standard
  # Promtail idiom, but is worth being explicit about: read access to the
  # Docker socket is broad (any container's logs, not just this stack's),
  # so this trades that for not having to configure a static list of log
  # paths that drifts every time a service is added/renamed. `:ro` limits
  # promtail's OWN mount to read-only; it doesn't change what the socket
  # itself permits a process that talks to it, so this is still the socket
  # access Grafana's own docs assume promtail gets in this deployment shape.
  promtail:
    <<: *restart
    profiles: ["observability"]
    image: grafana/promtail:3.3.2
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    networks:
      - observability
    depends_on:
      loki:
        condition: service_started

  # Host metrics (CPU/mem/disk/network). Deliberately on the bridge network
  # rather than network_mode: host, unlike most node-exporter examples --
  # every other service in this stack is network-isolated the same way, and
  # container-scoped CPU/mem/filesystem metrics (what DiskSpaceWarning/
  # Critical in alert.rules.yml actually need) don't require host networking.
  # Real host network-interface stats are the accepted tradeoff.
  node-exporter:
    <<: *restart
    profiles: ["observability"]
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - observability

  # MariaDB metrics -- only meaningful with BOTH profiles active:
  #   docker compose --profile mariadb --profile observability up -d
  # (needs the mariadb service to actually exist). See
  # backend/db/mariadb/10-accounts.sh for the clarion_metrics account this
  # authenticates as (PROCESS + REPLICATION CLIENT + performance_schema
  # SELECT only -- no access to the clarion schema itself).
  #
  # Review finding (2026-09-15): PROCESS is what SHOW FULL PROCESSLIST needs,
  # which can show OTHER connections' live SQL text -- and clarion_app's
  # driver (PyMySQL) does client-side %s interpolation, not server-side
  # prepared statements, so a query's literal parameter values (NRIC, names,
  # clinical text) sit in that SQL text while it's executing. The default
  # collector set does NOT actually run SHOW PROCESSLIST, but the
  # CREDENTIAL carries that capability regardless -- --collect.info_schema.
  # processlist=false pins that off explicitly (belt-and-suspenders against
  # a future default flip or someone adding flags later).
  # MARIADB_METRICS_PASSWORD is therefore NOT a throwaway monitoring
  # credential -- same rotation/secrecy tier as MARIADB_APP_PASSWORD.
  mysqld-exporter:
    # No env_file -- only MARIADB_METRICS_PASSWORD, already resolved via
    # ${...} below; same reasoning as grafana's own comment above.
    <<: *restart
    profiles: ["observability"]
    image: prom/mysqld-exporter:v0.15.1
    command:
      - --collect.info_schema.processlist=false
    environment:
      DATA_SOURCE_NAME: "clarion_metrics:${MARIADB_METRICS_PASSWORD:-change-me-metrics-password}@(mariadb:3306)/"
    expose:
      - "9104"
    networks:
      - internal
      - observability
    depends_on:
      mariadb:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Branch campus edge (P5.3, tender: two-campus rollout). Deliberately its
  # OWN compose profile and its OWN network (`branch-edge`, not `edge`/
  # `internal`) -- it is NOT another hop inside the central stack, it
  # models a genuinely separate site whose only path to patient data is a
  # WAN call to the central proxy's public HTTPS endpoint
  # (CLARION_CENTRAL_BACKEND_ORIGIN), same trust boundary as any other
  # client. See proxy/branch-edge/README.md for what this is and is not
  # (real WAN validation needs the real link -- this is the config +
  # local-serving half, always buildable without one; see that README for
  # why "+ Redis" from the original architecture sketch was dropped).
  branch-proxy:
    # Deliberately NOT *env-file: unlike the central `proxy` (co-located
    # with the trusted stack), this container runs at a physically separate
    # site modelled as an untrusted network boundary -- it must not carry
    # MariaDB/MinIO/SECRET_KEY/OTP_HMAC_KEY etc. from .env.docker into its
    # environment when it needs none of them. Every var it actually uses is
    # named explicitly below.
    <<: *restart
    image: caddy:2.8-alpine
    profiles: ["branch-edge"]
    environment:
      CLARION_SITE_ADDRESS: ${CLARION_BRANCH_SITE_ADDRESS:-localhost}
      CLARION_TLS_DIRECTIVE: ${CLARION_TLS_DIRECTIVE:-tls internal}
      CLARION_HSTS: ${CLARION_HSTS:-max-age=300}
      # Full origin of the CENTRAL site's public edge, e.g.
      # https://clarion.example.edu.my -- every /api/* request makes this one
      # WAN hop. Deliberately `:-` not `:?` -- a `:?` required var here
      # would fail `docker compose config`/`up` for EVERY invocation of this
      # file, even with `branch-edge` not in --profile (Compose validates all
      # services' required vars eagerly regardless of active profile; see
      # docs/operations-manual.md's note, found via this exact var). Caddy
      # fails loudly enough on an empty/invalid reverse_proxy target at
      # container start if this profile IS enabled without setting it.
      CLARION_CENTRAL_BACKEND_ORIGIN: ${CLARION_CENTRAL_BACKEND_ORIGIN:-}
    # Security review 2026-09-15: a bare host:port or http:// origin would
    # make Caddy reverse-proxy every /api/* call over PLAINTEXT across the
    # real Main Campus<->Branch WAN with no error and none of this stack's
    # usual TLS-failure signals -- fail loud at startup instead, same
    # "validate before use" discipline as web/entrypoint.sh's API_BASE guard.
    command: >
      sh -c 'case "$$CLARION_CENTRAL_BACKEND_ORIGIN" in
        https://*) ;;
        *) echo "FATAL: CLARION_CENTRAL_BACKEND_ORIGIN must start with https:// (got: $$CLARION_CENTRAL_BACKEND_ORIGIN)" >&2; exit 1 ;;
      esac
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    cap_add:
      # simulate-wan.sh ONLY (tc netem against this container's own
      # interface, for WAN-degradation testing) -- no other use, and no
      # other service in this stack gets this capability.
      - NET_ADMIN
    ports:
      - "${BRANCH_HTTP_PORT:-8080}:80"
      - "${BRANCH_HTTPS_PORT:-8443}:443"
    volumes:
      - ./proxy/branch-edge/Caddyfile:/etc/caddy/Caddyfile:ro
      # Security review 2026-09-15: Branch's OWN cert directory, NOT
      # ./proxy/certs (the central site's -- would ship its TLS private key
      # to this less-trusted site in a real deployment).
      - ./proxy/branch-edge/certs:/etc/caddy/certs:ro
      - branch_caddy_data:/data
      - branch_caddy_config:/config
    networks:
      - branch-edge
    depends_on:
      branch-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  branch-web:
    <<: *restart
    # Same image the central `web` service builds -- no separate build, no
    # separate sync mechanism. It's already the built static SPA (nginx);
    # running a second copy of it AT Branch is the entire "static/SPA off
    # the WAN" win the architecture note was after.
    image: clarion/web:local
    profiles: ["branch-edge"]
    environment:
      API_BASE: /api
    expose:
      - "8080"
    networks:
      - branch-edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# ===========================================================================
# Networks -- three segments, nothing on the default network.
#   edge          : proxy <-> web, proxy <-> backend. Fixed subnet so the
#                   proxy holds a stable address (172.28.0.2) that the
#                   backend trusts for X-Forwarded-* (FORWARDED_ALLOW_IPS).
#                   web has no route to the data tier; the data/PACS tier
#                   has no route to the API.
#   internal      : backend <-> mariadb / minio / redis / orthanc(+pg).
#   observability : prometheus/grafana/loki/promtail/alertmanager/
#                   exporters <-> backend (scraped) / mariadb (via
#                   mysqld-exporter, also on `internal`). backend always
#                   joins this network; the rest of the tier is behind the
#                   `observability` profile (P5.1) -- see that profile's
#                   own comment above the first service using it.
# ===========================================================================
networks:
  edge:
    driver: bridge
    ipam:
      config:
        # Dynamic IPs from .10.0/24 upward; .0.2-.0.9 reserved for static
        # assignment (the proxy holds .0.2).
        - subnet: 172.28.0.0/16
          ip_range: 172.28.10.0/24
          gateway: 172.28.0.1
  internal:
    driver: bridge
  observability:
    driver: bridge
  # `branch-edge` profile only (P5.3) -- deliberately isolated from edge/
  # internal/observability: this network's only route to patient data is
  # branch-proxy's own outbound WAN call, same as any internet client.
  branch-edge:
    driver: bridge

# ===========================================================================
# Volumes -- named, so `docker compose down` keeps the data.
# ===========================================================================
volumes:
  clarion_db:
  clarion_uploads:
  clarion_backup:
  mariadb_data:
  minio_data:
  redis_data:
  orthanc_data:
  orthanc_pg_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  branch_caddy_data:
  branch_caddy_config:

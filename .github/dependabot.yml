# Dependabot version updates. Weekly, minor+patch bumps grouped into one PR per folder so
# the repo is not flooded; a major version bump always comes as its own PR for review.
# Security alerts/fixes are separate (Settings > Advanced Security) and need no file.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /bridge
    schedule: { interval: weekly, day: monday }
    groups:
      bridge-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: pub
    directory: /mobile_flutter
    schedule: { interval: weekly, day: monday }
    groups:
      flutter-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/backend, /backend/backup, /web]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }

name: API

# Backend tests plus a check that the Docker images still build. Only runs when something it
# depends on changed (or by hand), so a red "API" badge means the API / Docker side broke.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/Dockerfile"
      - "web/nginx.conf"
      - "proxy/**"
      - "docker-compose*.yml"
      - ".env.docker.example"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/Dockerfile"
      - "web/nginx.conf"
      - "proxy/**"
      - "docker-compose*.yml"
      - ".env.docker.example"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SECRET_KEY: ci-only-secret-key
      OTP_HMAC_KEY: ci-only-otp-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # pytest is pinned in requirements-dev.txt, which also holds heavy lint/scan tools the test run
      # does not need (semgrep, locust), so install just that one pin plus the runtime requirements.
      - run: pip install -r requirements.txt "$(grep -E '^pytest==' requirements-dev.txt)"
      - name: Run tests
        run: |
          set +e
          python -m pytest tests -q -p no:cacheprovider 2>&1 | tee /tmp/pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Put the failing test names and error lines in the run's annotations (readable without
            # opening the full log).
            msg=$(grep -E '^(FAILED|ERROR) |^E  ' /tmp/pytest.log | head -60 | cut -c1-240 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pytest failures::${msg}"
            tailmsg=$(tail -n 40 /tmp/pytest.log | cut -c1-220 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pytest output tail::${tailmsg}"
          fi
          exit $rc

  docker:
    name: Docker (compose config, image builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: |
          cp .env.docker.example .env.docker
          docker compose --env-file .env.docker config -q
      - name: Build the backend image
        run: docker build -t clarion/backend:ci backend
      - name: Build the web image
        run: docker build -t clarion/web:ci web

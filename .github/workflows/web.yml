name: Web

# Staff console + public emergency page: unit tests, lint, production build.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (vitest, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # vitest's jsdom/undici need a recent Node (20 lacks markAsUncloneable); the image build uses its own
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: |
          set +e
          npx vitest run 2>&1 | tee /tmp/vitest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg=$(grep -E 'FAIL|Error|expected|×' /tmp/vitest.log | head -60 | cut -c1-240 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=vitest failures::${msg}"
          fi
          exit $rc
      - run: npm run lint
      - run: npm run build

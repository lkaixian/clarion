name: Flutter

# The patient / responder mobile app: static analysis and tests.
on:
  push:
    branches: [main]
    paths:
      - "mobile_flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "mobile_flutter/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    name: Android debug build
    needs: flutter   # only worth building once analyze + tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - name: Build the APK
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -n 60 /tmp/build.log | cut -c1-220 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter build output tail::${msg}"
          fi
          exit $rc
      - name: The NFC launch filter got the configured host
        run: |
          # The APP's merged manifest only: every plugin module has its own merged_manifests dir
          # too, and none of those carries the launch filter.
          f=$(find build/app/intermediates/merged_manifests/debug -name AndroidManifest.xml | head -1)
          test -n "$f" || { echo "::error::no merged debug manifest found under build/app"; exit 1; }
          echo "merged manifest: $f"
          grep -n 'android:host' "$f" || { echo "::error::no android:host in $f"; exit 1; }
          grep -q 'android:host="clarion.larmkx.com"' "$f" || { echo "::error::launch filter host is not clarion.larmkx.com"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: clarion-debug-apk
          path: mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

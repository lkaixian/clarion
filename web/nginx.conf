# CLARION web console -- nginx site config.
#
# Two ways to point the SPA at the API (pick one via the compose `API_BASE` env):
#
#   1. Same-origin proxy (default, no CORS):  API_BASE=/api
#      The browser calls https://<host>/api/... and nginx forwards to the
#      backend below. CORS_ALLOWED_ORIGINS on the backend can stay empty.
#
#   2. Direct:  API_BASE=http://backend:8000  (or a public backend URL)
#      The browser talks to the backend directly; the backend must allow the
#      web origin in CORS_ALLOWED_ORIGINS.
#
# entrypoint.sh writes window.__CLARION_API_BASE__ from $API_BASE into
# /usr/share/nginx/html/config.js at container start.

upstream clarion_backend {
    # Compose service name on the shared bridge network.
    server backend:8000;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The public landing page owns "/"; the SPA login lives at /login.
    location = / {
        add_header Cache-Control "no-store";
        try_files /welcome.html =404;
    }

    # Never cache the runtime config or the app shell.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Long-lived cache for fingerprinted Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API proxy, strips the /api prefix. NOTE: behind the P1.9
    # edge proxy (Caddy) this is never on the request path -- Caddy routes
    # /api/* straight to the backend. It is kept for running the `web`
    # container standalone / without the edge. Do not add auth or security
    # headers here; the edge owns those.
    location /api/ {
        proxy_pass http://clarion_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 20m;   # matches backend MAX_UPLOAD_BYTES (15MB) + slack
    }

    # SPA history-API fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Basic hardening for the standalone / no-edge case. The full CSP/HSTS
    # set is owned by the P1.9 edge proxy, which also overrides these.
    # X-Frame-Options is DENY to match the edge (the console is never framed).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# CLARION on a Raspberry Pi 4 behind a Cloudflare Tunnel -- the public demo node.
#
# Slim sibling of docker-compose.yml. This is the CENTRAL node: it owns the one
# shared MariaDB + MinIO that every hospital node (docker-compose.spoke.yml)
# connects to over a private link. No Orthanc / observability. The ONLY way
# in from the internet is the tunnel (DB/MinIO ports bind to CENTRAL_BIND_IP,
# default loopback -- set it to this host's Tailscale/WireGuard address):
#
#   internet -> Cloudflare -> cloudflared -> proxy (Caddy, headers + routing)
#                                              |- /            welcome + status page
#                                              |- /login ...   React SPA (web)
#                                              '- /api/*       FastAPI (backend)
#
# One-time setup
#   1. Cloudflare Zero Trust > Networks > Tunnels > create tunnel, copy the token.
#      Public hostname: clarion.larmkx.com -> Service  HTTPS://proxy:443
#      Additional settings: No TLS Verify = on, Origin Server Name = clarion.larmkx.com
#   2. .env.docker (see .env.docker.example) needs, at minimum:
#        SECRET_KEY, OTP_HMAC_KEY            (two different token_hex(32) values)
#        CLARION_SITE_ADDRESS=clarion.larmkx.com
#      .env.tunnel (separate file, NOT .env.docker): TUNNEL_TOKEN=...
#      Shared-data values the spokes must also hold: MARIADB_APP_PASSWORD,
#      MINIO_BACKEND_PASSWORD and the SAME SECRET_KEY / OTP_HMAC_KEY.
#      CENTRAL_BIND_IP=<this host's private-link address>   (never 0.0.0.0)
#   3. bash backend/db/mariadb/generate-encryption-key.sh     # once (TDE keyfile)
#      docker compose -f docker-compose.pi.yml --env-file .env.docker up -d --build
#   4. docker compose -f docker-compose.pi.yml exec backend python /app/seed.py
#      APP_ENV is "production" here, so seed prints a random password per demo
#      account ONCE -- copy them. (The admin123-style demo logins are deliberately
#      NOT used on a public URL.) Put Cloudflare Access in front if you want a gate.
#
# First build on a Pi 4 is slow (10-20 min: Python wheels + vite). Use a 64-bit OS.

name: clarion-pi

x-restart: &restart
  restart: unless-stopped

x-env-file: &env-file
  env_file:
    - path: ./.env.docker
      required: false

services:
  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    # Token lives in its own file so the backend (which loads .env.docker) never holds it.
    env_file: ./.env.tunnel
    volumes:
      # Caddy's local root CA (public cert only, copied from the proxy container) so cloudflared can
      # verify the proxy: dashboard > Additional settings > CA Pool = this path, No TLS Verify off.
      - ./proxy/certs/caddy-root.crt:/etc/cloudflared/caddy-root.crt:ro
    networks:
      app:
        ipv4_address: 172.29.0.3
    depends_on:
      proxy:
        condition: service_healthy

  proxy:
    <<: *restart
    image: caddy:2.8-alpine
    environment:
      CLARION_SITE_ADDRESS: ${CLARION_SITE_ADDRESS:?set CLARION_SITE_ADDRESS in .env.docker}
      CLARION_TLS_DIRECTIVE: tls internal   # Cloudflare holds the public cert; this hop is private
      CLARION_HSTS: ${CLARION_HSTS:-max-age=300}
      # Real client IP: trust cloudflared's X-Forwarded-For (compose subnet only)
      # so the per-IP rate limiter doesn't see every visitor as cloudflared.
      CLARION_TRUSTED_PROXIES: 172.29.0.3/32   # cloudflared, the only client Caddy trusts
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      app:
        ipv4_address: 172.29.0.2
    depends_on:
      web:
        condition: service_started   # healthy races nginx's first probe on slow starts
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backend:
    <<: [*restart, *env-file]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clarion/backend:local
    # 2 workers (image default is 4): a Pi 4 has 4 cores and 2-8 GB shared with everything.
    command: ["gunicorn", "app.main:app", "-k", "uvicorn_worker.UvicornWorker", "-w", "2",
              "-b", "0.0.0.0:8000", "--timeout", "60", "--access-logfile", "-", "--error-logfile", "-"]
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://clarion_app:${MARIADB_APP_PASSWORD:-change-me-app}@mariadb:3306/${MARIADB_DATABASE:-clarion}?charset=utf8mb4
      CLARION_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: clarion-backend
      MINIO_SECRET_KEY: ${MINIO_BACKEND_PASSWORD:-change-me-minio-backend}
      MINIO_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      # The public node: these roles must enrol an authenticator app (TOTP) at
      # first sign-in. Anyone who enrols is challenged regardless of role.
      CLARION_MFA_REQUIRED_ROLES: ${CLARION_MFA_REQUIRED_ROLES:-admin,clinician,records_officer}
      CLARION_APP_LATEST_VERSION: ${CLARION_APP_LATEST_VERSION:-1.6.0}
      CLARION_APP_MIN_VERSION: ${CLARION_APP_MIN_VERSION:-}
      CLARION_DISABLE_LOCAL_AI: "1"   # no Ollama on the Pi; AI falls back to deterministic paths
      # Trust X-Forwarded-* from exactly the proxy and cloudflared hops. gunicorn takes plain IPs
      # only (a CIDR crashes it at boot), hence the pinned addresses on those two services.
      FORWARDED_ALLOW_IPS: 172.29.0.2,172.29.0.3
    volumes:
      - clarion_db:/app/data
    expose: ["8000"]
    networks: [app]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    <<: *restart
    build:
      context: ./web
      dockerfile: Dockerfile
    image: clarion/web:local
    environment:
      API_BASE: /api
    expose: ["8080"]
    networks: [app]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Shared database -- the single source of truth for every node. Reached by
  # the local backend over `app`, and by spokes via CENTRAL_BIND_IP:3306.
  mariadb:
    <<: [*restart, *env-file]
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-clarion}
      MARIADB_APP_PASSWORD: ${MARIADB_APP_PASSWORD:-change-me-app}
      MARIADB_MIGRATE_PASSWORD: ${MARIADB_MIGRATE_PASSWORD:-change-me-migrate}
      MARIADB_REPORT_PASSWORD: ${MARIADB_REPORT_PASSWORD:-change-me-report}
      MARIADB_METRICS_PASSWORD: ${MARIADB_METRICS_PASSWORD:-change-me-metrics-password}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M   # Pi 4: shared with everything else
      - --max-connections=200
      - --log-bin=clarion-bin
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=604800
      - --log-bin-trust-function-creators=1
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/db/mariadb:/docker-entrypoint-initdb.d:ro
      - ./backend/db/mariadb/encryption.cnf:/etc/mysql/mariadb.conf.d/99-encryption.cnf:ro
      - ./backend/db/mariadb/encryption:/etc/mysql/encryption:ro
    ports:
      # Private link only. Loopback unless CENTRAL_BIND_IP is set.
      - "${CENTRAL_BIND_IP:-127.0.0.1}:${CENTRAL_DB_PORT:-3306}:3306"
    networks: [app]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # One-shot: brings the shared schema to head as the DDL account. Spokes never
  # migrate (their backend verifies-or-refuses), so upgrade central first.
  migrate:
    <<: *env-file   # SECRET_KEY: migration b2d7e4a9c1f6 keys the audit hash chain with it
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clarion/backend:local
    restart: "no"
    working_dir: /app
    environment:
      DATABASE_URL: mysql+pymysql://clarion_migrate:${MARIADB_MIGRATE_PASSWORD:-change-me-migrate}@mariadb:3306/${MARIADB_DATABASE:-clarion}?charset=utf8mb4
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks: [app]
    depends_on:
      mariadb:
        condition: service_healthy

  # Shared object store (documents, signatures, photos). A spoke writing to a
  # local disk would hide its uploads from every other node.
  minio:
    <<: [*restart, *env-file]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clarion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clarion-dev-secret}
    volumes:
      - minio_data:/data
    ports:
      - "${CENTRAL_BIND_IP:-127.0.0.1}:9000:9000"   # S3 API; console stays internal
    networks: [app]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  minio-init:
    <<: [*restart, *env-file]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "/init/10-accounts.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clarion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clarion-dev-secret}
      MINIO_BACKEND_PASSWORD: ${MINIO_BACKEND_PASSWORD:-change-me-minio-backend}
      MINIO_ORTHANC_PASSWORD: ${MINIO_ORTHANC_PASSWORD:-change-me-minio-orthanc}
      MINIO_BACKUP_PASSWORD: ${MINIO_BACKUP_PASSWORD:-change-me-minio-backup}
    volumes:
      - ./backend/db/minio/10-accounts.sh:/init/10-accounts.sh:ro
      - ./backend/db/minio/policies:/policies:ro
    networks: [app]
    depends_on:
      minio:
        condition: service_healthy

  # Central MPI / record locator: holds only hospital public keys and opaque
  # visit pointers (no PHI, no NRICs). ONE worker on purpose -- its replay
  # cache is process-local. Reached through the proxy at /mpi/*.
  mpi:
    <<: *restart
    image: clarion/backend:local
    command: ["uvicorn", "mpi.main:app", "--host", "0.0.0.0", "--port", "8100", "--workers", "1"]
    working_dir: /app
    environment:
      MPI_DATABASE_URL: sqlite:////app/data/mpi.db
      MPI_ADMIN_TOKEN: ${MPI_ADMIN_TOKEN:-}   # unset = hospital registration disabled
    volumes:
      - mpi_data:/app/data   # image-owned dir: a fresh named volume inherits its ownership
    expose: ["8100"]
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

networks:
  app:
    ipam:
      config:
        - subnet: 172.29.0.0/24
          ip_range: 172.29.0.128/25   # dynamic IPs; .2/.3 stay free for proxy/cloudflared

volumes:
  clarion_db:
  mpi_data:
  mariadb_data:
  minio_data:
  redis_data:
  caddy_data:

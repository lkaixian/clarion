name: mobile_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.0+5

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Ships with the Flutter SDK itself (no extra download weight) — powers
  # Material/Cupertino/Widgets locale delegates for the 4 supported
  # languages (English, Malay, Chinese Simplified, Tamil).
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Networking. Chosen over plain `http` for its built-in interceptor
  # support (used here to attach the bearer token / current base URL to
  # every request) — still a small, dependency-light package.
  dio: ^5.7.0

  # Secure storage for the auth token
  flutter_secure_storage: ^9.2.2

  # Runtime-editable settings (API base URL + locale overrides)
  shared_preferences: ^2.3.3

  # State management — deliberately Provider (not Riverpod/BLoC/GetX):
  # smallest footprint of the mainstream options and enough for this app's
  # handful of screens and providers.
  provider: ^6.1.2

  # Required for AppLocalizations (date/number formatting, message
  # interpolation) — version pinned to what this Flutter SDK ships with.
  intl: ^0.20.2

  # Camera-based QR/barcode scanning for the emergency-card scanner
  # (responder flow) — ML Kit on Android under the hood.
  mobile_scanner: ^7.0.1

  # Reading physical NFC card UIDs (responder flow) for senior citizens /
  # anyone without a smartphone. Android-only feature in this app; iOS NFC
  # reading has extra entitlement requirements out of scope here.
  nfc_manager: ^4.0.2

  # Local (device-only) medication + appointment reminder notifications —
  # no backend endpoint for this, purely client-side scheduling.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # Reads the device's actual IANA timezone name so scheduled reminders
  # (e.g. "8 AM") fire at the user's real local time, not UTC.
  flutter_timezone: ^4.1.0

  # Runtime permission requests (camera / notifications) with a shared,
  # consistent API instead of hand-rolling platform channel calls.
  permission_handler: ^11.3.1

  # Website fallback for the MySejahtera launcher (see
  # lib/services/mysejahtera_launcher.dart).
  url_launcher: ^6.3.1

  # Opens another installed app directly by its verified Android package
  # name (falling back to its Play Store listing automatically if it's
  # not installed) — used for the MySejahtera launcher instead of
  # guessing a custom URL scheme.
  external_app_launcher: ^4.0.2

  # Standard, minimal package for capturing the two NRIC photos during
  # self-service registration (lib/screens/self_register_screen.dart) via
  # the device camera. No live camera preview is needed here (unlike
  # mobile_scanner's QR use case) — just `ImagePicker().pickImage(source:
  # ImageSource.camera)` returning an `XFile` to upload. The single,
  # standard package for this exact job, same "no stacked alternatives"
  # philosophy as every other dependency in this section.
  image_picker: ^1.1.2

  # P3.10: "download/share visit summaries as PDF". The PDF
  # endpoint is Bearer-authed (same as every other API call), so it must be
  # fetched via Dio into memory first — plain url_launcher can't attach that
  # header. share_plus is the standard, minimal package for the remaining
  # step ("hand these bytes to the OS share/open sheet"): it writes to a
  # temp file and wraps the Android FileProvider/iOS share-sheet plumbing
  # that a raw file:// URI hits StrictMode/FileUriExposedException on --
  # there's no stdlib or already-installed path that does this safely.
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates lib/l10n/generated/app_localizations.dart from the ARB files
  # in lib/l10n/ (configured via l10n.yaml) on every `flutter pub get` /
  # `flutter build` / `flutter run`.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  assets:
    - assets/icon/clarion_icon.png
    - assets/images/clarion_logo_full.png

# flutter_launcher_icons config: regenerates android/app/src/main/res/mipmap-*/
# ic_launcher.png (+ the adaptive-icon XML/resources) from
# assets/icon/clarion_icon.png (== Logo/Logo/Logo.png). Run via
# `dart run flutter_launcher_icons`; on this machine use the space-free junction
# `D:\flutter_sdk\bin\dart.bat run flutter_launcher_icons` (see
# memory/android-sdk-on-d-drive.md).
#
# The source image is a transparent-background PNG of the bare CLARION mark.
# `image_path` still feeds the legacy square launcher icon (transparent regions
# show through to the launcher background). `adaptive_icon_*` additionally emits
# an Android 8+ adaptive icon so the mark sits on a solid white tile instead of
# floating -- the mark is dark teal/navy, which reads well on white and would
# disappear on a navy tile. Same source PNG is reused as the foreground layer.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/clarion_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/clarion_icon.png"
